name: Fetch BCV rates

on:
  schedule:
    # 12:00am hora Venezuela (UTC-4) = 04:00 UTC, con offset a :10
    # para evitar el pico global de runs en :00.
    - cron: '8 4 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar scraping de tasas BCV
        run: python cron/fetch_bcv_rates.py --once
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_TYPE: postgresql
          DATABASE_ECHO: 'False'
          SECRET_KEY_JWT: ${{ secrets.SECRET_KEY_JWT }}
          ALGORITHIM_HASH_JWT: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: '90'
          BCV_BASE_URL: 'https://www.bcv.org.ve'
          BCV_VERIFY_SSL: 'False'
          HTTP_TIMEOUT_SECONDS: '20'
          HTTP_MAX_RETRIES: '3'
