name: Keep-alive

on:
  schedule:
    # Cada 45 días, 00:00 UTC del día 1 de cada mes.
    # Si el día no cae en el ciclo, GitHub lo omite (Ej: solo corre en el día 1 de cada ciclo de 45 días).
    - cron: '0 0 1 */45 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/keepalive-workflow@v2
