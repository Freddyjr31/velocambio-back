name: Keep-alive

on:
  schedule:
    # Cada 45 días, 00:00 UTC del día 1 de cada mes.
    - cron: '0 0 1 */45 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "keepalive: $(date -u +%Y-%m-%d)"
          git push
